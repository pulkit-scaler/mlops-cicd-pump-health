name: Pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# The default for every job. A job that needs more asks for it itself.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write             # the test results appear as a check of their own
      pull-requests: write      # and as a comment on the pull request
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the tests
        run: python -m pytest -v --junitxml=test-results.xml

      - name: Publish the test results
        if: ${{ !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-results.xml